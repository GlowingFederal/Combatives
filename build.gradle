buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') {
            changing = true
        }
    }
}

apply plugin: 'forge'

// Semantic release version + automatic build iteration support.
ext.versionPropertiesFile = file('version.properties')

if (!versionPropertiesFile.exists()) {
    versionPropertiesFile.text = '# Combatives version state\n# Edit mod_version for releases; build_number is managed automatically for production builds.\nmod_version=1.0.0\nbuild_number=0\n'
}

ext.readVersionState = {
    Properties props = new Properties()
    versionPropertiesFile.withInputStream { props.load(it) }

    String loadedModVersion = props.getProperty('mod_version')
    String loadedBuildNumber = props.getProperty('build_number')

    if (!loadedModVersion) {
        throw new GradleException("version.properties must define mod_version=x.y.z")
    }
    if (!(loadedBuildNumber ==~ /\d+/)) {
        throw new GradleException("version.properties build_number must be a non-negative integer")
    }

    ext.modVersion = loadedModVersion
    ext.buildNumber = loadedBuildNumber as int
    ext.fullVersion = "${modVersion}.${buildNumber}"
    version = fullVersion
}

ext.writeBuildNumberPreservingFormat = { int nextBuildNumber ->
    String originalText = versionPropertiesFile.getText('UTF-8')
    def buildNumberPattern = ~/(?m)^(\s*build_number\s*=\s*)\d+(\s*(?:[#!].*)?)$/
    String updatedText = originalText.replaceFirst(buildNumberPattern) { String fullMatch, String prefix, String suffix ->
        "${prefix}${nextBuildNumber}${suffix}"
    }

    if (updatedText == originalText) {
        String separator = originalText.endsWith(System.lineSeparator()) || originalText.length() == 0 ? '' : System.lineSeparator()
        updatedText = originalText + separator + "build_number=${nextBuildNumber}" + System.lineSeparator()
    }

    versionPropertiesFile.write(updatedText, 'UTF-8')
}

readVersionState()

def productionTaskNames = [
        'build',
        'assemble',
        'reobf',
        'reobfJar',
        'uploadArchives'
] as Set

def shouldIncrementBuildNumber = { graph ->
    graph.allTasks.any { task ->
        productionTaskNames.contains(task.name) || task.name.toLowerCase(Locale.ROOT).contains('reobf')
    }
}

def buildNumberWasIncremented = false
def originalBuildNumber = null

gradle.taskGraph.whenReady { graph ->
    if (shouldIncrementBuildNumber(graph)) {
        originalBuildNumber = buildNumber
        writeBuildNumberPreservingFormat(originalBuildNumber + 1)
        readVersionState()
        buildNumberWasIncremented = true

        tasks.withType(org.gradle.jvm.tasks.Jar) { jarTask ->
            jarTask.archiveName = "${jarTask.baseName}-${fullVersion}.${jarTask.extension}"
        }

        logger.lifecycle("Using production version ${fullVersion}")
    }
}

gradle.buildFinished { result ->
    if (buildNumberWasIncremented && result.failure != null) {
        writeBuildNumberPreservingFormat(originalBuildNumber)
        readVersionState()
        logger.lifecycle("Restored build_number to ${originalBuildNumber} after failed build")
    }
}

group = "com.glowingfederal.combatives"
archivesBaseName = "combatives"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}


gradle.projectsEvaluated {
    tasks.withType(JavaExec) { task ->
        if (task.name == "runClient" || task.name == "runServer") {
            args "--tweakClass", "org.spongepowered.asm.launch.MixinTweaker"
            jvmArgs "-Dfml.coreMods.load=io.github.legacymoddingmc.unimixins.all.AllCore"


        }
    }
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven/"
    }
    flatDir { dirs "libs" }
}

dependencies {
    compile name: "+unimixins-all-1.7.10-0.3.1"
    compile("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        transitive = false
    }
}

// Dependencies can be added here, e.g.
// dependencies {
//     compile "some.group:artifact:version"
// }

// Generate the production refmap consumed by both Combatives mixin configs.
ext.combativesRefmapName = 'mixins.combatives.refmap.json'
ext.combativesRefmapFile = file("${tasks.compileJava.temporaryDir}/${combativesRefmapName}")
ext.combativesOutSrgFile = file("${tasks.compileJava.temporaryDir}/combatives-mixin-out.srg")

afterEvaluate {
    tasks.compileJava.options.compilerArgs += [
            "-AreobfSrgFile=${tasks.reobf.srg}",
            "-AoutSrgFile=${combativesOutSrgFile}",
            "-AoutRefMapFile=${combativesRefmapFile}"
    ]
}

jar {
    from(combativesRefmapFile) {
        into ''
    }
}

reobf {
    addExtraSrgFile combativesOutSrgFile
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
                'ForceLoadAsMod': 'true',
                'FMLCorePlugin': 'com.glowingfederal.combatives.loading.CombativesCorePlugin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}
