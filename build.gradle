// ==============================================
//  Combatives - Forge 1.7.10 Build
//  ForgeGradle 1.2 (Anatawa12 Fork)
// ==============================================

buildscript {
    repositories {
        mavenCentral()

        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }

        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }

    dependencies {
        classpath("com.anatawa12.forge:ForgeGradle:1.2-1.0.+") {
            changing = true
        }
    }
}

apply plugin: "forge"

// --------------------------------------------------
// Version management
// --------------------------------------------------

ext.versionPropertiesFile = file("version.properties")

if (!versionPropertiesFile.exists()) {
    versionPropertiesFile.text =
            "# Combatives version state\n" +
                    "# Edit mod_version for releases; build_number is managed automatically for production builds.\n" +
                    "mod_version=1.0.0\n" +
                    "build_number=0\n"
}

ext.loadVersionState = {
    Properties properties = new Properties()

    versionPropertiesFile.withInputStream {
        properties.load(it)
    }

    String loadedModVersion = properties.getProperty("mod_version")
    String loadedBuildNumber = properties.getProperty("build_number")

    if (!loadedModVersion) {
        throw new GradleException(
                "version.properties must define mod_version=x.y.z"
        )
    }

    if (!(loadedBuildNumber ==~ /\d+/)) {
        throw new GradleException(
                "version.properties build_number must be a non-negative integer"
        )
    }

    ext.modVersion = loadedModVersion
    ext.buildNumber = loadedBuildNumber as int
    ext.fullVersion = "${modVersion}.${buildNumber}"

    project.version = fullVersion
}

ext.writeBuildNumber = { int nextBuildNumber ->
    String originalText = versionPropertiesFile.getText("UTF-8")

    def buildNumberPattern =
            ~/(?m)^(\s*build_number\s*=\s*)\d+(\s*(?:[#!].*)?)$/

    String updatedText = originalText.replaceFirst(
            buildNumberPattern
    ) {
        String fullMatch,
        String prefix,
        String suffix ->

            "${prefix}${nextBuildNumber}${suffix}"
    }

    if (updatedText == originalText) {
        String separator =
                originalText.length() == 0 ||
                        originalText.endsWith(System.lineSeparator())
                        ? ""
                        : System.lineSeparator()

        updatedText =
                originalText +
                        separator +
                        "build_number=${nextBuildNumber}" +
                        System.lineSeparator()
    }

    versionPropertiesFile.write(updatedText, "UTF-8")
}

loadVersionState()

def productionTaskNames = [
        "build",
        "assemble",
        "reobf",
        "reobfJar",
        "uploadArchives"
] as Set

def requestedTaskNames = gradle.startParameter.taskNames.collect {
    String taskPath -> taskPath.tokenize(":").last()
}

def productionBuildRequested = requestedTaskNames.any {
    String taskName ->

        productionTaskNames.contains(taskName) ||
                taskName.toLowerCase(Locale.ROOT).contains("reobf")
}

def buildNumberWasIncremented = false
def originalBuildNumber = buildNumber

/*
 * Increment before tasks and resource expansion are configured.
 *
 * The previous taskGraph.whenReady approach occurred too late for some
 * archive names and expanded resource values.
 */
if (productionBuildRequested) {
    writeBuildNumber(originalBuildNumber + 1)
    loadVersionState()

    buildNumberWasIncremented = true

    logger.lifecycle("Using production version ${fullVersion}")
}

gradle.buildFinished {
    BuildResult result ->

        if (buildNumberWasIncremented && result.failure != null) {
            writeBuildNumber(originalBuildNumber)
            loadVersionState()

            logger.lifecycle(
                    "Restored build_number to ${originalBuildNumber} after failed build"
            )
        }
}

// --------------------------------------------------
// Project identity
// --------------------------------------------------

group = "com.glowingfederal.combatives"
archivesBaseName = "Combatives"

// --------------------------------------------------
// Minecraft / Forge
// --------------------------------------------------

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

// --------------------------------------------------
// Development launch configuration
// --------------------------------------------------

gradle.projectsEvaluated {
    tasks.withType(JavaExec) {
        JavaExec task ->

            if (task.name == "runClient" || task.name == "runServer") {
                args(
                        "--tweakClass",
                        "org.spongepowered.asm.launch.MixinTweaker"
                )

                jvmArgs(
                        "-Dfml.coreMods.load=" +
                                "io.github.legacymoddingmc.unimixins.all.AllCore"
                )
            }
    }
}

// --------------------------------------------------
// Repositories and dependencies
// --------------------------------------------------

repositories {
    mavenCentral()

    maven {
        url = "https://maven.minecraftforge.net/"
    }

    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven/"
    }

    flatDir {
        dirs "libs"
    }
}

dependencies {
    compile name: "+unimixins-all-1.7.10-0.3.1"

    compile("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        transitive = false
    }
}

// --------------------------------------------------
// Mixin annotation processor / refmap
// --------------------------------------------------

ext.combativesRefmapName =
        "mixins.combatives.refmap.json"

ext.combativesRefmapFile =
        file("${tasks.compileJava.temporaryDir}/${combativesRefmapName}")

ext.combativesOutSrgFile =
        file("${tasks.compileJava.temporaryDir}/combatives-mixin-out.srg")

afterEvaluate {
    tasks.compileJava.options.compilerArgs += [
            "-AreobfSrgFile=${tasks.reobf.srg}",
            "-AoutSrgFile=${combativesOutSrgFile}",
            "-AoutRefMapFile=${combativesRefmapFile}"
    ]
}

/*
 * Apply Mixin-generated SRG mappings while ForgeGradle reobfuscates the
 * normal production jar.
 */
reobf {
    addExtraSrgFile combativesOutSrgFile
}

// --------------------------------------------------
// Normal resources
// --------------------------------------------------

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"

        expand(
                version: project.version,
                modName: "Combatives"
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

jar {
    from(combativesRefmapFile) {
        into ""
    }

    manifest {
        attributes(
                "ForceLoadAsMod": "true",
                "FMLCorePlugin":
                        "com.glowingfederal.combatives.loading." +
                                "CombativesCorePlugin",
                "FMLCorePluginContainsFMLMod": "true"
        )
    }
}

// Exercise the production yaw helper without needing a running client/server.
task verifyLeanBasis(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'com.glowingfederal.combatives.movement.PlayerLocalBasisTest'
}
check.dependsOn verifyLeanBasis
